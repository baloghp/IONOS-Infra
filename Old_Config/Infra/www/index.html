<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITTD.APP - AI Hub</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .service-links {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        .service-link {
            background-color: #3498db;
            color: #fff;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            margin: 10px;
            text-align: center;
            flex-basis: calc(50% - 20px);
        }
        .service-link:hover {
            background-color: #2980b9;
        }
        footer {
            margin-top: 30px;
            text-align: center;
            color: #7f8c8d;
        }
        @media (max-width: 600px) {
            .service-link {
                flex-basis: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to ITTD.APP AI Hub</h1>
        <p>
            This is your centralized AI development environment. Access our services below:
        </p>
        <div class="service-links">
            <a href="https://automate.ittd.app" class="service-link">Automate</a>
            <a href="https://cvforge.ittd.app" class="service-link">CVForge</a>
            <a href="https://parsr.ittd.app" class="service-link">Parsr</a>
            <a href="https://aiacc.ittd.app" class="service-link">AIACC</a>
            <a href="https://proxy.ittd.app" class="service-link">LiteLLM</a>
        </div>   
        <footer>
            <p>&copy; 2025 ITTD.APP. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
