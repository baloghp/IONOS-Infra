---
# Variables for all hosts. Do not store secrets here — use ansible-vault if needed.
ansible_user: admin
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_ionos_aihub"

admin_user: admin
admin_ssh_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_ionos_aihub.pub"
admin_sudo_group: sudo

ssh_hardening_enabled: true

fail2ban_ignore_ips:
  - 127.0.0.1/8
  - ::1
  - 100.118.29.96

fail2ban_findtime: 10m
fail2ban_bantime: 15m
fail2ban_maxretry: 5

# WireGuard server mesh (Plan/06-wireguard-server-network.md)
wireguard_port: 51820
wireguard_persistent_keepalive: 25

wireguard_hosts:
  ts-ionos-backend:
    wg_address: 10.44.0.1/24
    wg_ip: 10.44.0.1
    public_ip: 82.165.44.144
  ts-ionos-frontend:
    wg_address: 10.44.0.2/24
    wg_ip: 10.44.0.2
    public_ip: 217.154.18.227
  ts-ionos-infra:
    wg_address: 10.44.0.3/24
    wg_ip: 10.44.0.3
    public_ip: 82.165.34.239

# Pinned production image versions (service roles + www.ittd.app status badges).
#
# After changing a pin, ALWAYS:
#   1. ansible-playbook playbooks/<service>.yml --tags …
#   2. ansible-playbook playbooks/gateway.yml
# The 30-minute platform-status timer does NOT reload pins from Git.
# Full checklist: Plan/05-implementation-phases/05-backend-product-services.md
#   § Pin bump checklist
platform_image_pins:
  openbao: "2.4.1"
  forgejo: "15.0.2"
  woodpecker: "3.15.0"
  glitchtip: "6.1.8"
  n8n: "2.43.4"
  litellm: "1.105.0"
  unleash: "6.9.0"
  supabase_gotrue: "2.186.0"
  supabase_studio: "2026.04.27-sha-5f60601"

