---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "Debian"
    fail_msg: "The base role currently supports Debian/Ubuntu hosts only."

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - apt-listchanges
      - apt-transport-https
      - ca-certificates
      - curl
      - fail2ban
      - git
      - gnupg
      - htop
      - jq
      - lsb-release
      - nftables
      - python3-apt
      - rsync
      - systemd-timesyncd
      - unattended-upgrades
      - unzip
      - ufw
      - vim
    state: present

- name: Ensure persistent journald directory exists
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure persistent journald storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-persistent.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=1G
  notify: Restart systemd-journald

- name: Enable systemd time synchronization
  ansible.builtin.command: timedatectl set-ntp true
  changed_when: false

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Ensure apt daily timers are enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Configure fail2ban SSH jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/10-sshd.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFAULT]
      ignoreip = {{ fail2ban_ignore_ips | join(' ') }}
      bantime = {{ fail2ban_bantime }}
      findtime = {{ fail2ban_findtime }}
      maxretry = {{ fail2ban_maxretry }}

      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      backend = systemd
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started

