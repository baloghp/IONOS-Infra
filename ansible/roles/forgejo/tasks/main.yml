---
- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "Debian"
    fail_msg: "The forgejo role currently supports Debian/Ubuntu hosts only."

- name: Ensure secrets directory exists on Infra
  ansible.builtin.file:
    path: "{{ forgejo_credentials_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure Forgejo project directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ forgejo_project_dir }}"
    - "{{ forgejo_project_dir }}/data"

- name: Deploy Forgejo Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_project_dir }}/{{ forgejo_compose_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart forgejo stack

- name: Deploy Forgejo OpenBao sync script
  ansible.builtin.template:
    src: sync-forgejo-from-openbao.sh.j2
    dest: "{{ forgejo_credentials_dir }}/sync-forgejo-from-openbao.sh"
    owner: root
    group: root
    mode: "0700"

- name: Deploy Forgejo bootstrap script
  ansible.builtin.template:
    src: bootstrap-forgejo.sh.j2
    dest: "{{ forgejo_credentials_dir }}/bootstrap-forgejo.sh"
    owner: root
    group: root
    mode: "0700"

- name: Check if Forgejo environment file exists
  ansible.builtin.stat:
    path: "{{ forgejo_project_dir }}/.env"
  register: forgejo_env_stat

- name: Deploy Forgejo environment skeleton when missing
  when: not forgejo_env_stat.stat.exists
  ansible.builtin.template:
    src: env.forgejo.j2
    dest: "{{ forgejo_project_dir }}/.env"
    owner: root
    group: root
    mode: "0600"

- name: Read Forgejo env for OpenBao sync marker
  when: forgejo_env_stat.stat.exists
  ansible.builtin.slurp:
    src: "{{ forgejo_project_dir }}/.env"
  register: forgejo_env_slurp

- name: Set Forgejo sync pending flag
  when: forgejo_env_stat.stat.exists
  ansible.builtin.set_fact:
    forgejo_sync_pending: >-
      {{ (forgejo_env_slurp.content | b64decode) is search('REPLACE_AFTER_OPENBAO') }}

- name: Set Forgejo sync pending when env missing
  when: not forgejo_env_stat.stat.exists
  ansible.builtin.set_fact:
    forgejo_sync_pending: true

- name: Ensure Forgejo stack is running
  when: not (forgejo_sync_pending | default(true))
  ansible.builtin.command:
    cmd: docker compose -f {{ forgejo_project_dir }}/{{ forgejo_compose_file }} up -d --remove-orphans
  register: forgejo_compose_up
  changed_when: >-
    'Started' in forgejo_compose_up.stdout or
    'Created' in forgejo_compose_up.stdout or
    'Recreated' in forgejo_compose_up.stdout or
    'Pulled' in forgejo_compose_up.stdout

- name: Report Forgejo status
  ansible.builtin.debug:
    msg: >-
      {% if forgejo_sync_pending | default(true) %}
      Forgejo NOT started — run: sudo -E {{ forgejo_credentials_dir }}/sync-forgejo-from-openbao.sh
      {% else %}
      Forgejo: {{ forgejo_public_url }} ({{ forgejo_wg_bind }}:{{ forgejo_port }})
      {% endif %}
