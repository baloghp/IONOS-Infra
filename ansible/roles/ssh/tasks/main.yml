---
- name: Ensure sudo is installed
  ansible.builtin.package:
    name: sudo
    state: present

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    create_home: true
    groups: "{{ admin_sudo_group }}"
    append: true
    state: present

- name: Install admin SSH public key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ lookup('file', admin_ssh_public_key_file) }}"
    state: present

- name: Allow admin user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-{{ admin_user }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    validate: /usr/sbin/visudo -cf %s

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_hardening_enabled | bool

- name: Configure SSH daemon hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-cvforge-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
  notify: Validate and reload ssh
  when: ssh_hardening_enabled | bool

